# EdgeFirst site-wide build policy — installed into every build dir by
# edgefirst-setup. Survives build-directory recreation; edit here, not in
# per-directory local.conf.

# Yocto is a resource hog: cap scheduler and make parallelism well below
# core count to keep peak memory in check on shared build hosts.
BB_NUMBER_THREADS = "4"
PARALLEL_MAKE = "-j4"

# crates.io rejects wget's default User-Agent with HTTP 403; identify
# the fetcher explicitly so crate:// fetches succeed.
FETCHCMD_wget = "/usr/bin/env wget --tries=2 --timeout=100 -U 'edgefirst-yocto-fetcher (+https://github.com/EdgeFirstAI/yocto)'"

# Host-specific secrets (e.g. KINARA_MIRROR for the NDA Ara-2 runtime)
# still belong in local.conf — do not commit them here.

# Updating a board with apt (opt-in with EDGEFIRST_APT_FEED). The images carry
# the feed configuration for their BSP, and the kernel packages copy the kernel
# and device trees to the boot partition that U-Boot reads. Keep
# EDGEFIRST_FEED_BSP equal to the name of the feed published for this branch's
# BSP.
EDGEFIRST_FEED_BSP = "imx-6.18.20-2.0.0"
EDGEFIRST_VENDOR = "NXP i.MX"
EDGEFIRST_APT_FEED = "1"

# Release this build leads up to, YYYY.MM.PATCH: YYYY.MM is the quarterly
# release and PATCH counts its rolling updates. Builds before the release carry
# ~dev (or ~rcN); the release build sets EDGEFIRST_VERSION without the suffix in
# local.conf.
EDGEFIRST_VERSION ?= "2026.10.0~dev"
CORE_IMAGE_EXTRA_INSTALL += "edgefirst-release"
