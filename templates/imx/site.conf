# EdgeFirst site-wide build policy — installed into every build dir by
# edgefirst-setup. Survives build-directory recreation; edit here, not in
# per-directory local.conf.

# Yocto is a resource hog: cap scheduler and make parallelism well below
# core count to keep peak memory in check on shared build hosts.
BB_NUMBER_THREADS = "4"
PARALLEL_MAKE = "-j4"

# crates.io rejects wget's default User-Agent with HTTP 403; identify
# the fetcher explicitly so crate:// fetches succeed.
FETCHCMD_wget = "/usr/bin/env wget --tries=2 --timeout=100 -U 'edgefirst-yocto-fetcher (+https://github.com/EdgeFirstAI/yocto)'"

# Host-specific secrets (e.g. KINARA_MIRROR for the NDA Ara-2 runtime)
# still belong in local.conf — do not commit them here.
